      <stop offset="0%" stop-color="#140b05"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fb8500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
