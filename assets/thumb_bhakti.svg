  <!-- Stylized Lotus Motif -->
  <path d="M 300 120 C 315 150, 340 170, 300 215 C 260 170, 285 150, 300 120 Z" fill="#ffb703" opacity="0.85"/>
  <path d="M 270 145 C 290 165, 310 185, 275 215 C 240 180, 255 160, 270 145 Z" fill="#fb8500" opacity="0.75"/>
  <path d="M 330 145 C 310 165, 290 185, 325 215 C 360 180, 345 160, 330 145 Z" fill="#fb8500" opacity="0.75"/>
  <text x="300" y="340" fill="#ffb703" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2">DEVOTIONAL VISUALS &amp; SPIRITUAL CONCEPTS</text>
