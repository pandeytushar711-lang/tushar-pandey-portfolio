<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="areaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <!-- Grid Lines -->
  <line x1="60" y1="80" x2="540" y2="80" stroke="#1f2430" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="140" x2="540" y2="140" stroke="#1f2430" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="200" x2="540" y2="200" stroke="#1f2430" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="260" x2="540" y2="260" stroke="#1f2430" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Area fill -->
  <path d="M 60 260 Q 140 240, 200 180 T 340 130 T 460 90 T 540 60 L 540 300 L 60 300 Z" fill="url(#areaGlow)"/>
  <!-- Chart Line -->
  <path d="M 60 260 Q 140 240, 200 180 T 340 130 T 460 90 T 540 60" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Data Points -->
  <circle cx="200" cy="180" r="5" fill="#00e5ff" stroke="#ffffff" stroke-width="2"/>
  <circle cx="340" cy="130" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
  <circle cx="460" cy="90" r="5" fill="#8a2be2" stroke="#ffffff" stroke-width="2"/>
  <circle cx="540" cy="60" r="6" fill="#00e5ff" stroke="#ffffff" stroke-width="2.5"/>
  <!-- KPI Badges -->
  <rect x="60" y="315" width="130" height="36" rx="6" fill="#131722" stroke="#252b3b"/>
  <text x="75" y="338" fill="#8b949e" font-family="sans-serif" font-size="11" font-weight="600">META ADS ROAS: </text>
  <text x="160" y="338" fill="#00e5ff" font-family="sans-serif" font-size="12" font-weight="700">4.8x</text>

  <rect x="210" y="315" width="150" height="36" rx="6" fill="#131722" stroke="#252b3b"/>
  <text x="225" y="338" fill="#8b949e" font-family="sans-serif" font-size="11" font-weight="600">FLIPKART ADS: </text>
  <text x="315" y="338" fill="#6366f1" font-family="sans-serif" font-size="12" font-weight="700">+142%</text>

  <rect x="380" y="315" width="160" height="36" rx="6" fill="#131722" stroke="#252b3b"/>
  <text x="395" y="338" fill="#8b949e" font-family="sans-serif" font-size="11" font-weight="600">SCALED SPEND: </text>
  <text x="495" y="338" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="700">OPTIMIZED</text>
</svg>